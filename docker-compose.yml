version: '3.8'

services:
  # Main RAG Chatbot Application
  rag-chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot
    ports:
      - "8501:8501"  # Streamlit UI
    volumes:
      - ./data:/app/data                    # Document data
      - ./vectorstore:/app/vectorstore      # FAISS index persistence
      - ./logs:/app/logs                    # Application logs
      - ./evaluation:/app/evaluation        # Evaluation dataset
    environment:
      STREAMLIT_SERVER_HEADLESS: true
      DEVICE: cpu                           # Use cpu or cuda
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Langfuse for LLM observability (comment out if not needed)
  # langfuse:
  #   image: langfuse/langfuse:latest
  #   container_name: langfuse
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/langfuse
  #     NEXTAUTH_SECRET: your-secret-key
  #     NEXTAUTH_URL: http://localhost:3000
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped

  # Optional: PostgreSQL database for Langfuse (comment out if not needed)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: postgres
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: langfuse
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

networks:
  default:
    name: rag-network
